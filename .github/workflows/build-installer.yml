name: Build Install-Wulf

on:
  push:
    paths:
      - 'winamp/winamp_latest_installer.exe'
      - 'installer/**'
      - 'scripts/**'
      - '.github/workflows/build-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official NSIS 3.12
        shell: powershell
        run: |
          $url = 'https://sourceforge.net/projects/nsis/files/NSIS%203/3.12/nsis-3.12-setup.exe/download'
          $setup = Join-Path $env:RUNNER_TEMP 'nsis-3.12-setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $setup
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NSIS setup failed: $($p.ExitCode)" }
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { throw 'NSIS 3.12 makensis.exe was not installed.' }
          & $makensis /VERSION

      - name: Install 7-Zip
        shell: powershell
        run: choco install 7zip -y --no-progress

      - name: Build installer
        shell: powershell
        run: .\scripts\build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winamp-InstallWulf-fixed
          path: build/output/Winamp_InstallWulf-fixed.exe
          if-no-files-found: error

      - name: Generate SHA-256
        shell: powershell
        run: |
          $hash = Get-FileHash .\build\output\Winamp_InstallWulf-fixed.exe -Algorithm SHA256
          $hash | Format-List
          "$($hash.Hash)  Winamp_InstallWulf-fixed.exe" | Out-File .\build\output\SHA256SUMS.txt -Encoding ascii

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: Winamp-InstallWulf-fixed-checksum
          path: build/output/SHA256SUMS.txt
          if-no-files-found: error
